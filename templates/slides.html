<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/reveal.js/reset.css">
    <link rel="stylesheet" href="/css/reveal.js/reveal.css">
    <link rel="stylesheet" href="/css/reveal.js/theme/black.css">
    <link rel="stylesheet" href="/css/atom-one-dark.css">

    <!-- customization for slides -->
    <link rel="stylesheet" href="/css/slides.css">

    <!-- Printing and PDF exports -->
    <script>
      var link = document.createElement( 'link' );
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = window.location.search.match( /print-pdf/gi )
                ? '/css/reveal.js/print/pdf.css'
                : '/css/reveal.js/print/paper.css';
      document.getElementsByTagName( 'head' )[0].appendChild( link );
    </script>

    <title>{{ page.title }}</title>
  </head>
  <body>
    <div class="reveal">
      <div id="twitter-link">@felixmulder</div>
      <div class="slides">
        {{ load_data(path="generated/slides/" ~ page.extra.slides_body, format="plain") | safe }}
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.0.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.0.2/plugin/zoom/zoom.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.0.2/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.0.2/plugin/notes/notes.js"></script>

    <script>
      // More info https://github.com/hakimel/reveal.js#configuration
      Reveal.initialize({
        controls: false,
        progress: false,
        slideNumber: 'c/t',
        //center: false,
        hash: true,
        transition: 'none', // none/fade/slide/convex/concave/zoom

        plugins: [RevealZoom, RevealHighlight, RevealNotes]
      });
    </script>
  </body>
</html>
